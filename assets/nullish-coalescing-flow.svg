<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title description">
  <title id="title">How nullish coalescing works</title>
  <desc id="description">If the value is null or undefined, use the fallback. Otherwise, keep the original value, including false, zero, or an empty string.</desc>
  <rect width="1000" height="320" rx="20" fill="#f4f7fb"/>
  <text x="500" y="42" fill="#17243a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">value ?? fallback</text>
  <rect x="38" y="105" width="245" height="110" rx="14" fill="#e2eaf7"/>
  <text x="160" y="150" fill="#17243a" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Check the value</text>
  <text x="160" y="182" fill="#42536b" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle">null or undefined?</text>
  <path d="M283 135h57V90h50" stroke="#70819b" stroke-width="4" fill="none"/>
  <path d="m378 80 14 10-14 10" stroke="#70819b" stroke-width="4" fill="none"/>
  <path d="M283 185h57v60h50" stroke="#70819b" stroke-width="4" fill="none"/>
  <path d="m378 235 14 10-14 10" stroke="#70819b" stroke-width="4" fill="none"/>
  <text x="303" y="126" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">YES</text>
  <text x="303" y="178" fill="#176b45" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">NO</text>
  <rect x="392" y="55" width="250" height="70" rx="14" fill="#ffe7e4"/>
  <text x="517" y="85" fill="#8e2119" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Use the fallback</text>
  <text x="517" y="109" fill="#8e2119" font-family="Consolas, monospace" font-size="16" text-anchor="middle">fallback</text>
  <rect x="392" y="210" width="250" height="70" rx="14" fill="#dff4e9"/>
  <text x="517" y="238" fill="#176b45" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Keep the original value</text>
  <text x="517" y="261" fill="#176b45" font-family="Consolas, monospace" font-size="14" text-anchor="middle">false, 0, and "" are preserved</text>
  <path d="M642 90h58M642 245h58M700 90v155M700 167h50" stroke="#70819b" stroke-width="4" fill="none"/>
  <path d="m740 157 14 10-14 10" stroke="#70819b" stroke-width="4" fill="none"/>
  <rect x="754" y="120" width="208" height="95" rx="14" fill="#fff1c2"/>
  <text x="858" y="158" fill="#70500a" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Return the result</text>
  <text x="858" y="188" fill="#70500a" font-family="Consolas, monospace" font-size="17" text-anchor="middle">value ?? fallback</text>
</svg>
